[project]
name = "bbm-analysis"
version = "0.1.0"
description = "Static analysis worker: Slither findings + advisory LLM explanations"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pydantic>=2.9,<3",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "httpx2>=2.15",
    "ruff>=0.7",
    "pytest-socket>=0.7",
    "datamodel-code-generator[ruff]>=0.86",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/analysis"]

[tool.ruff]
line-length = 100
target-version = "py312"
# Generated from packages/shared/schema; regenerate instead of editing.
extend-exclude = ["src/analysis/generated"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--disable-socket --allow-unix-socket"
