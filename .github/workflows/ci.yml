name: CI

on:
  push:
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ---------------------------------------------------------------------
  # Compute which parts of the monorepo changed so downstream jobs only
  # run when relevant. Root/shared config changes (lockfile, base
  # tsconfig, eslint config, this workflow file, etc.) fan out to every
  # TS/JS job, since a change there can break any package. The contracts
  # job is a separate toolchain (Foundry/Solidity) and is intentionally
  # NOT triggered by root JS/TS config changes.
  # ---------------------------------------------------------------------
  changes:
    name: Detect changed paths
    runs-on: ubuntu-latest
    outputs:
      root: ${{ steps.filter.outputs.root }}
      web: ${{ steps.filter.outputs.web }}
      api: ${{ steps.filter.outputs.api }}
      shared: ${{ steps.filter.outputs.shared }}
      contracts: ${{ steps.filter.outputs.contracts }}
      analysis: ${{ steps.filter.outputs.analysis }}
      containers: ${{ steps.filter.outputs.containers }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # Full history so paths-filter can diff against the correct
          # base commit on both push and pull_request events.
          fetch-depth: 0

      - name: Filter paths
        id: filter
        uses: dorny/paths-filter@v3
        with:
          # NOTE: YAML anchors cannot merge *into* another sequence (only
          # mappings support the `<<` merge key), so `root`'s paths are
          # intentionally repeated under web/api/shared below rather than
          # aliased - an aliased `- *root` here would nest as a single
          # list-shaped element instead of flattening, which paths-filter
          # would not interpret as individual glob patterns. `root` is
          # also kept as its own output; job-level `if` conditions OR it
          # in, so a root config change fans out to every TS/JS job.
          filters: |
            root:
              - 'package.json'
              - 'pnpm-lock.yaml'
              - 'pnpm-workspace.yaml'
              - 'tsconfig.base.json'
              - 'eslint.config.mjs'
              - '.prettierrc.json'
              - '.github/workflows/ci.yml'

            # packages/shared is a dependency-to-be of both apps/web and
            # apps/api (the real @bbm/shared schemas package lands in
            # feat/shared-schemas), so changes there must also re-run
            # the web and api jobs even though no pnpm dependency edge
            # exists yet.
            web:
              - 'apps/web/**'
              - 'packages/shared/**'
            api:
              - 'apps/api/**'
              - 'packages/shared/**'
            shared:
              - 'packages/shared/**'

            # Separate toolchain (Foundry/Solidity) - not affected by
            # root JS/TS tooling config.
            contracts:
              - 'contracts/**'

            # Python worker; also re-run when the shared JSON Schemas change,
            # since its pydantic models are generated from them.
            analysis:
              - 'workers/analysis/**'
              - 'packages/shared/schema/**'
              - '.github/workflows/ci.yml'

            # Anything that can change a container image or the compose
            # stack. The containers job builds every image and boots the
            # full stack, so it fans out from all component sources.
            containers:
              - 'tests/**'
              - '**/Dockerfile'
              - '**/.dockerignore'
              - 'docker-compose*.yml'
              - 'apps/**'
              - 'packages/shared/**'
              - 'workers/**'
              - 'contracts/**'

  # ---------------------------------------------------------------------
  # apps/web - placeholder package today, becomes the real Next.js app
  # in a later branch. Scripts are run with --if-present so this job
  # succeeds cleanly today and "just works" once real scripts land.
  # ---------------------------------------------------------------------
  web:
    name: web
    needs: changes
    if: needs.changes.outputs.web == 'true' || needs.changes.outputs.root == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm --filter @bbm/web run --if-present lint

      - name: Typecheck
        run: pnpm --filter @bbm/web run --if-present typecheck

      - name: Test
        run: pnpm --filter @bbm/web run --if-present test

      - name: Build
        run: pnpm --filter @bbm/web run --if-present build

  # ---------------------------------------------------------------------
  # packages/shared - placeholder TS package today. Also runs a
  # "generated schema is up to date" check. The gen:schema script does
  # not exist yet (it is added in feat/shared-schemas); run with
  # --if-present so this step is a harmless no-op today and becomes a
  # real staleness check the moment that script lands, with no CI
  # changes required.
  # ---------------------------------------------------------------------
  shared:
    name: shared
    needs: changes
    if: needs.changes.outputs.shared == 'true' || needs.changes.outputs.root == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm --filter @bbm/shared run --if-present lint

      - name: Typecheck
        run: pnpm --filter @bbm/shared run --if-present typecheck

      - name: Test
        run: pnpm --filter @bbm/shared run --if-present test

      - name: Regenerate schema (if gen:schema exists)
        run: pnpm --filter @bbm/shared run --if-present gen:schema

      - name: Fail if generated schema is out of date
        run: git diff --exit-code -- packages/shared/schema

  # ---------------------------------------------------------------------
  # apps/api - real Fastify app with real lint/typecheck/test/build
  # scripts already. Run them directly (no --if-present) so this job
  # fails loudly if one of those scripts ever disappears.
  # ---------------------------------------------------------------------
  api:
    name: api
    needs: changes
    if: needs.changes.outputs.api == 'true' || needs.changes.outputs.root == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm --filter @bbm/api run lint

      - name: Typecheck
        run: pnpm --filter @bbm/api run typecheck

      - name: Test
        run: pnpm --filter @bbm/api run test

      - name: Build
        run: pnpm --filter @bbm/api run build

  # ---------------------------------------------------------------------
  # contracts - Foundry project. forge-std is a git submodule at
  # contracts/lib/forge-std, so checkout fetches it (same as a contributor
  # running `git submodule update --init --recursive`). Slither then runs a
  # static analysis pass over the same sources.
  # ---------------------------------------------------------------------
  contracts:
    name: contracts
    needs: changes
    if: needs.changes.outputs.contracts == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install Foundry
        uses: foundry-rs/foundry-toolchain@v1
        with:
          # Pinned: gas snapshots differ across forge versions. Keep in sync
          # with contracts/Dockerfile.
          version: v1.3.5

      - name: Forge build
        working-directory: contracts
        run: forge build

      - name: Forge test
        working-directory: contracts
        run: forge test -vvv

      # Regression: fail when gas usage changes without the committed
      # snapshot being updated (`forge snapshot` and commit the result).
      - name: Gas snapshot check
        working-directory: contracts
        run: forge snapshot --check

      - name: Deploy script dry run
        working-directory: contracts
        run: forge script script/Deploy.s.sol

      - name: Slither static analysis
        uses: crytic/slither-action@v0.4.0
        with:
          target: 'contracts/'
          # Findings are advisory in this product (explained by the LLM,
          # verified only via a sandboxed PoC) - CI should run Slither as a
          # sanity check, not gate merges on every detector hit.
          fail-on: none

  # ---------------------------------------------------------------------
  # workers/analysis - Python (uv) worker. Unit tests run with sockets
  # disabled (pytest-socket), and the pydantic models generated from
  # packages/shared/schema must be up to date.
  # ---------------------------------------------------------------------
  analysis:
    name: analysis
    needs: changes
    if: needs.changes.outputs.analysis == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: workers/analysis
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          cache-dependency-glob: workers/analysis/uv.lock

      - name: Install dependencies
        run: uv sync --frozen

      - name: Lint (ruff)
        run: uv run ruff check .

      - name: Format check (ruff)
        run: uv run ruff format --check .

      - name: Test (pytest)
        run: uv run pytest -q

      - name: Fail if generated models are out of date
        run: |
          uv run scripts/gen-types.sh
          git diff --exit-code -- src/analysis/generated

  # ---------------------------------------------------------------------
  # containers - lint every Dockerfile, build every image (BuildKit, GHA
  # layer cache, never pushed), then boot the full compose stack and
  # smoke-test it: health endpoints, a contract upload through the web
  # proxy into the real API + Postgres, and a contract deploy to anvil.
  # ---------------------------------------------------------------------
  containers:
    name: containers
    needs: changes
    if: needs.changes.outputs.containers == 'true' || needs.changes.outputs.root == 'true'
    runs-on: ubuntu-latest
    env:
      BBM_TAG: ci
      COMPOSE: docker compose -f docker-compose.yml -f docker-compose.ci.yml
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Lint Dockerfiles (hadolint)
        run: |
          for f in apps/api/Dockerfile apps/web/Dockerfile workers/analysis/Dockerfile contracts/Dockerfile; do
            echo "::group::$f"
            docker run --rm -i hadolint/hadolint:v2.12.0 < "$f"
            echo "::endgroup::"
          done

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build images
        uses: docker/bake-action@v6
        with:
          source: .
          files: docker-compose.yml
          targets: api,web,analysis,anvil
          load: true
          set: |
            api.cache-from=type=gha,scope=api
            api.cache-to=type=gha,mode=max,scope=api
            web.cache-from=type=gha,scope=web
            web.cache-to=type=gha,mode=max,scope=web
            analysis.cache-from=type=gha,scope=analysis
            analysis.cache-to=type=gha,mode=max,scope=analysis
            anvil.cache-from=type=gha,scope=contracts
            anvil.cache-to=type=gha,mode=max,scope=contracts

      - name: Images run as non-root
        run: |
          for svc in api web analysis contracts; do
            uid=$(docker run --rm --entrypoint id "bbm/$svc:ci" -u)
            echo "$svc uid=$uid"
            test "$uid" != "0"
          done

      - name: Start stack
        run: $COMPOSE up -d --wait --wait-timeout 180 --no-build db api web analysis anvil

      - name: Deploy contracts to anvil
        run: |
          mkdir -p .ci/deployments && chmod 777 .ci/deployments
          $COMPOSE run --rm contracts-deploy
          cat .ci/deployments/31337.json

      - name: Smoke test
        run: |
          set -euo pipefail
          curl -fsS localhost:3001/health
          curl -fsS localhost:3000/healthz
          curl -fsS localhost:8000/health
          curl -fsS -o /dev/null localhost:3000/
          printf 'pragma solidity ^0.8.19;\ncontract Smoke {}\n' > /tmp/Smoke.sol
          # Upload through the web proxy -> api -> Postgres, then read it back.
          id=$(curl -fsS -F file=@/tmp/Smoke.sol \
            -F developerAddress=0x70997970C51812dc3A010C7d01b50e0d17dc79C8 \
            -F bountyAmount=1000000000000000000 -F currency=ETH \
            -F deadline=2030-01-01T00:00:00.000Z \
            localhost:3000/api/contracts | jq -r .id)
          echo "created contract $id"
          curl -fsS "localhost:3000/api/contracts/$id" | jq -e --arg id "$id" '.id == $id'

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # System test tiers against the running stack (see tests/README.md).
      # BBM_* URLs default to the compose ports; deployments JSON comes from
      # the contracts-deploy step above.
      - name: Integration tests
        run: pnpm --filter @bbm/system-tests run test:integration

      - name: Regression tests (API goldens)
        env:
          CI: 'true'
        run: pnpm --filter @bbm/system-tests run test:regression

      - name: Smoke tests
        run: pnpm --filter @bbm/system-tests run test:smoke

      - name: Install Playwright browser
        run: pnpm --filter @bbm/system-tests exec playwright install --with-deps chromium

      - name: E2E tests (Playwright)
        run: pnpm --filter @bbm/system-tests run e2e

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: tests/e2e/playwright-report/
          if-no-files-found: ignore

      - name: Dump logs on failure
        if: failure()
        run: $COMPOSE logs --no-color > compose.log

      - name: Upload logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: compose-logs
          path: compose.log

      - name: Stop stack
        if: always()
        run: $COMPOSE --profile deploy down -v

  # ---------------------------------------------------------------------
  # Single required status check for branch protection: succeeds as
  # long as every needed job either succeeded or was skipped (because
  # its path filter didn't match), and fails if any of them actually
  # failed.
  # ---------------------------------------------------------------------
  ci-ok:
    name: CI OK
    if: always()
    needs: [changes, web, shared, api, contracts, analysis, containers]
    runs-on: ubuntu-latest
    steps:
      - name: Check required job results
        run: |
          set -euo pipefail
          # `changes` itself is not allowed to be skipped/failed - if it
          # fails, every downstream job gets skipped by GitHub Actions,
          # which would otherwise look like a harmless all-skipped pass.
          declare -A results=(
            [changes]="${{ needs.changes.result }}"
            [web]="${{ needs.web.result }}"
            [shared]="${{ needs.shared.result }}"
            [api]="${{ needs.api.result }}"
            [contracts]="${{ needs.contracts.result }}"
            [analysis]="${{ needs.analysis.result }}"
            [containers]="${{ needs.containers.result }}"
          )
          failed=0
          for job in "${!results[@]}"; do
            result="${results[$job]}"
            echo "$job: $result"
            if [[ "$job" == "changes" ]]; then
              if [[ "$result" != "success" ]]; then
                echo "::error::Required job 'changes' finished with status '$result'"
                failed=1
              fi
              continue
            fi
            if [[ "$result" != "success" && "$result" != "skipped" ]]; then
              echo "::error::Required job '$job' finished with status '$result'"
              failed=1
            fi
          done
          if [[ "$failed" -ne 0 ]]; then
            echo "One or more required jobs failed."
            exit 1
          fi
          echo "All required jobs succeeded or were skipped."

