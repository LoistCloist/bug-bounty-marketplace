[profile.default]
src = "src"
out = "out"
libs = ["lib"]
test = "test"
script = "script"
solc_version = "0.8.19"
optimizer = true
optimizer_runs = 200
# Deploy.s.sol writes deployments/<chainid>.json after a broadcast.
fs_permissions = [{ access = "read-write", path = "./deployments" }]

[fuzz]
# Fixed seed so fuzz runs, and so `forge snapshot --check`, are deterministic.
seed = "0x1"
