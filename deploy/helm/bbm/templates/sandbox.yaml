{{- /*
Sandbox stub (sandbox.enabled, default off). Untrusted analysis code will run
as short-lived Jobs in a separate, locked-down namespace on the Kata
(pod-sandboxing) node pool. Only the scaffolding is rendered here:
  - Namespace (PSA enforce=restricted)
  - ServiceAccount bbm-sandbox-runner (workload identity: sandboxClientId)
  - Role/RoleBinding: manage Jobs and read Pods/logs in that namespace only
  - ResourceQuota + LimitRange
  - NetworkPolicy denying ALL ingress and egress
  - ConfigMap holding the Job template the runner instantiates
NOTE: the Namespace is owned by the release; `helm uninstall` deletes it and
everything in it.
*/ -}}
{{- if .Values.sandbox.enabled }}
{{- $s := .Values.sandbox -}}
{{- $ns := $s.namespace -}}
{{- $jt := $s.jobTemplate -}}
{{- if .Values.azure.workloadIdentity.enabled }}
{{- $_ := include "bbm.requireInfra" (dict "root" $ "key" "azure.sandboxClientId" "value" .Values.azure.sandboxClientId) }}
{{- end }}
apiVersion: v1
kind: Namespace
metadata:
  name: {{ $ns }}
  labels:
    {{- include "bbm.labels" (dict "root" $ "component" "sandbox") | nindent 4 }}
    pod-security.kubernetes.io/enforce: restricted
    pod-security.kubernetes.io/enforce-version: latest
    pod-security.kubernetes.io/audit: restricted
    pod-security.kubernetes.io/warn: restricted
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "bbm.fullname" . }}-sandbox-runner
  namespace: {{ $ns }}
  labels:
    {{- include "bbm.labels" (dict "root" $ "component" "sandbox") | nindent 4 }}
  {{- if and .Values.azure.workloadIdentity.enabled .Values.azure.sandboxClientId }}
  annotations:
    azure.workload.identity/client-id: {{ .Values.azure.sandboxClientId | quote }}
  {{- end }}
automountServiceAccountToken: false
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ include "bbm.fullname" . }}-sandbox-runner
  namespace: {{ $ns }}
  labels:
    {{- include "bbm.labels" (dict "root" $ "component" "sandbox") | nindent 4 }}
rules:
  - apiGroups: ["batch"]
    resources: ["jobs"]
    verbs: ["create", "get", "list", "delete"]
  - apiGroups: [""]
    resources: ["pods", "pods/log"]
    verbs: ["get", "list"]
  - apiGroups: [""]
    resources: ["configmaps"]
    resourceNames: ["{{ include "bbm.fullname" . }}-sandbox-job-template"]
    verbs: ["get"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ include "bbm.fullname" . }}-sandbox-runner
  namespace: {{ $ns }}
  labels:
    {{- include "bbm.labels" (dict "root" $ "component" "sandbox") | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ include "bbm.fullname" . }}-sandbox-runner
subjects:
  - kind: ServiceAccount
    name: {{ include "bbm.fullname" . }}-sandbox-runner
    namespace: {{ $ns }}
---
apiVersion: v1
kind: ResourceQuota
metadata:
  name: {{ include "bbm.fullname" . }}-sandbox
  namespace: {{ $ns }}
  labels:
    {{- include "bbm.labels" (dict "root" $ "component" "sandbox") | nindent 4 }}
spec:
  hard:
    pods: {{ $s.quota.pods | quote }}
    count/jobs.batch: {{ $s.quota.jobs | quote }}
    requests.cpu: {{ $s.quota.requestsCpu | quote }}
    requests.memory: {{ $s.quota.requestsMemory | quote }}
    limits.cpu: {{ $s.quota.limitsCpu | quote }}
    limits.memory: {{ $s.quota.limitsMemory | quote }}
    requests.ephemeral-storage: {{ $s.quota.requestsEphemeralStorage | quote }}
    limits.ephemeral-storage: {{ $s.quota.limitsEphemeralStorage | quote }}
---
apiVersion: v1
kind: LimitRange
metadata:
  name: {{ include "bbm.fullname" . }}-sandbox
  namespace: {{ $ns }}
  labels:
    {{- include "bbm.labels" (dict "root" $ "component" "sandbox") | nindent 4 }}
spec:
  limits:
    - type: Container
      default:
        {{- toYaml $jt.resources.limits | nindent 8 }}
      defaultRequest:
        {{- toYaml $jt.resources.requests | nindent 8 }}
      max:
        {{- toYaml $jt.resources.limits | nindent 8 }}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "bbm.fullname" . }}-sandbox-deny-all
  namespace: {{ $ns }}
  labels:
    {{- include "bbm.labels" (dict "root" $ "component" "sandbox") | nindent 4 }}
spec:
  podSelector: {}
  policyTypes:
    - Ingress
    - Egress
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "bbm.fullname" . }}-sandbox-job-template
  namespace: {{ $ns }}
  labels:
    {{- include "bbm.labels" (dict "root" $ "component" "sandbox") | nindent 4 }}
data:
  # The runner fills in metadata.generateName suffix, image and args.
  job.yaml: |
    apiVersion: batch/v1
    kind: Job
    metadata:
      generateName: sandbox-run-
      namespace: {{ $ns }}
      labels:
        app.kubernetes.io/part-of: bbm
        app.kubernetes.io/component: sandbox-run
    spec:
      backoffLimit: 0
      activeDeadlineSeconds: {{ $jt.activeDeadlineSeconds }}
      ttlSecondsAfterFinished: {{ $jt.ttlSecondsAfterFinished }}
      template:
        metadata:
          labels:
            app.kubernetes.io/part-of: bbm
            app.kubernetes.io/component: sandbox-run
        spec:
          restartPolicy: Never
          {{- with $jt.runtimeClassName }}
          runtimeClassName: {{ . }}
          {{- end }}
          automountServiceAccountToken: false
          enableServiceLinks: false
          {{- with $jt.nodeSelector }}
          nodeSelector:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- with $jt.tolerations }}
          tolerations:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          securityContext:
            runAsNonRoot: true
            runAsUser: {{ $jt.runAsUser }}
            runAsGroup: {{ $jt.runAsUser }}
            seccompProfile:
              type: RuntimeDefault
          containers:
            - name: run
              image: REPLACED_BY_RUNNER
              resources:
                {{- toYaml $jt.resources | nindent 16 }}
              securityContext:
                allowPrivilegeEscalation: false
                readOnlyRootFilesystem: true
                capabilities:
                  drop:
                    - ALL
              volumeMounts:
                - name: work
                  mountPath: /work
          volumes:
            - name: work
              emptyDir:
                sizeLimit: {{ $jt.resources.limits | dig "ephemeral-storage" "512Mi" }}
{{- end }}
