{{- /*
NetworkPolicies for the release namespace (enforced by Cilium on AKS).

Ingress: default-deny; allow app-routing controller -> web/api, web -> api,
helm test pod -> web/api.
Egress (only when networkPolicy.restrictEgress): default-deny; allow DNS
for everything, plus per component:
  api        -> Postgres (5432 to postgresCidr), HTTPS 443 anywhere (Entra, Storage)
  web        -> api
  analysis   -> HTTPS 443 anywhere
  migrations -> Postgres
  test       -> web, api
*/ -}}
{{- if .Values.networkPolicy.enabled }}
{{- $np := .Values.networkPolicy -}}
{{- $fn := include "bbm.fullname" . -}}
{{- $_ := include "bbm.requireInfra" (dict "root" $ "key" "networkPolicy.postgresCidr" "value" (ternary $np.postgresCidr "n/a" $np.restrictEgress)) }}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ $fn }}-default-deny
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "bbm.labels" (dict "root" $) | nindent 4 }}
spec:
  podSelector: {}
  policyTypes:
    - Ingress
    {{- if $np.restrictEgress }}
    - Egress
    {{- end }}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ $fn }}-web-ingress
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "bbm.labels" (dict "root" $ "component" "web") | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "bbm.selectorLabels" (dict "root" $ "component" "web") | nindent 6 }}
  policyTypes:
    - Ingress
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: {{ $np.ingressControllerNamespace }}
        - podSelector:
            matchLabels:
              {{- include "bbm.selectorLabels" (dict "root" $ "component" "test") | nindent 14 }}
      ports:
        - port: {{ .Values.web.port }}
          protocol: TCP
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ $fn }}-api-ingress
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "bbm.labels" (dict "root" $ "component" "api") | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "bbm.selectorLabels" (dict "root" $ "component" "api") | nindent 6 }}
  policyTypes:
    - Ingress
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: {{ $np.ingressControllerNamespace }}
        - podSelector:
            matchLabels:
              {{- include "bbm.selectorLabels" (dict "root" $ "component" "web") | nindent 14 }}
        - podSelector:
            matchLabels:
              {{- include "bbm.selectorLabels" (dict "root" $ "component" "test") | nindent 14 }}
      ports:
        - port: {{ .Values.api.port }}
          protocol: TCP
{{- if $np.restrictEgress }}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ $fn }}-allow-dns
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "bbm.labels" (dict "root" $) | nindent 4 }}
spec:
  podSelector: {}
  policyTypes:
    - Egress
  egress:
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
          podSelector:
            matchLabels:
              k8s-app: kube-dns
      ports:
        - port: 53
          protocol: UDP
        - port: 53
          protocol: TCP
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ $fn }}-api-egress
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "bbm.labels" (dict "root" $ "component" "api") | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "bbm.selectorLabels" (dict "root" $ "component" "api") | nindent 6 }}
  policyTypes:
    - Egress
  egress:
    {{- with $np.postgresCidr }}
    - to:
        - ipBlock:
            cidr: {{ . }}
      ports:
        - port: 5432
          protocol: TCP
    {{- end }}
    - ports:
        - port: 443
          protocol: TCP
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ $fn }}-web-egress
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "bbm.labels" (dict "root" $ "component" "web") | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "bbm.selectorLabels" (dict "root" $ "component" "web") | nindent 6 }}
  policyTypes:
    - Egress
  egress:
    - to:
        - podSelector:
            matchLabels:
              {{- include "bbm.selectorLabels" (dict "root" $ "component" "api") | nindent 14 }}
      ports:
        - port: {{ .Values.api.port }}
          protocol: TCP
{{- if $np.postgresCidr }}
---
# Rendered whenever egress is restricted, independent of
# migrations.enabled: hooks run before the release manifest is applied, so
# a policy rendered only with migrations.enabled would not exist yet on the
# pre-upgrade that first turns migrations on, and the Job could not reach
# Postgres. On first install no policies exist yet, so nothing blocks it.
# Key Vault / Entra are reached by the CSI driver on the node, not this pod.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ $fn }}-migrations-egress
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "bbm.labels" (dict "root" $ "component" "migrations") | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "bbm.selectorLabels" (dict "root" $ "component" "migrations") | nindent 6 }}
  policyTypes:
    - Egress
  egress:
    - to:
        - ipBlock:
            cidr: {{ $np.postgresCidr }}
      ports:
        - port: 5432
          protocol: TCP
{{- end }}
{{- if .Values.analysis.enabled }}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ $fn }}-analysis-egress
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "bbm.labels" (dict "root" $ "component" "analysis") | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "bbm.selectorLabels" (dict "root" $ "component" "analysis") | nindent 6 }}
  policyTypes:
    - Egress
  egress:
    - ports:
        - port: 443
          protocol: TCP
{{- end }}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ $fn }}-test-egress
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "bbm.labels" (dict "root" $ "component" "test") | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "bbm.selectorLabels" (dict "root" $ "component" "test") | nindent 6 }}
  policyTypes:
    - Egress
  egress:
    - to:
        - podSelector:
            matchLabels:
              {{- include "bbm.selectorLabels" (dict "root" $ "component" "api") | nindent 14 }}
      ports:
        - port: {{ .Values.api.port }}
          protocol: TCP
    - to:
        - podSelector:
            matchLabels:
              {{- include "bbm.selectorLabels" (dict "root" $ "component" "web") | nindent 14 }}
      ports:
        - port: {{ .Values.web.port }}
          protocol: TCP
{{- end }}
{{- end }}
