{{- /*
AKS application routing add-on: a dedicated NGINX controller (IngressClass
bbm-nginx) whose LoadBalancer Service binds the static public IP that the
data stack owns (pip-bbm-<env>-ingress in rg-bbm-<env>-data-eus2).

CLUSTER-SCOPED resource: it is not namespaced, and two releases of this
chart in one cluster would fight over it. The controller pods run in
app-routing-system. The AKS cluster identity needs Network Contributor on
the PIP's resource group for the azure-pip-name binding to work.
*/ -}}
{{- if .Values.ingress.appRouting.enabled }}
{{- $i := .Values.ingress -}}
{{- $_ := include "bbm.requireInfra" (dict "root" $ "key" "ingress.publicIpName" "value" $i.publicIpName) }}
{{- $_ := include "bbm.requireInfra" (dict "root" $ "key" "ingress.publicIpResourceGroup" "value" $i.publicIpResourceGroup) }}
apiVersion: approuting.kubernetes.azure.com/v1alpha1
kind: NginxIngressController
metadata:
  name: {{ $i.appRouting.name }}
  labels:
    {{- include "bbm.labels" (dict "root" $) | nindent 4 }}
spec:
  ingressClassName: {{ $i.className }}
  controllerNamePrefix: {{ $i.appRouting.controllerNamePrefix }}
  {{- if or $i.publicIpName $i.publicIpResourceGroup }}
  loadBalancerAnnotations:
    {{- with $i.publicIpName }}
    service.beta.kubernetes.io/azure-pip-name: {{ . | quote }}
    {{- end }}
    {{- with $i.publicIpResourceGroup }}
    service.beta.kubernetes.io/azure-load-balancer-resource-group: {{ . | quote }}
    {{- end }}
  {{- end }}
  {{- with $i.appRouting.scaling }}
  scaling:
    {{- toYaml . | nindent 4 }}
  {{- end }}
{{- end }}
