{{- /*
ServiceAccounts. Names are fixed (bbm-api, bbm-web, bbm-analysis,
bbm-migrations) because terraform federates the workload identities with
system:serviceaccount:<ns>:<name>.

bbm-migrations is ONLY rendered as a pre-install/pre-upgrade hook (weight
-10) and only when migrations.enabled: the migrations Job is itself a hook
and runs before regular release resources exist. Rendering it also as a
regular resource would make Helm delete the hook-created SA when the
release manifest changes.
*/ -}}
{{- $wi := .Values.azure.workloadIdentity.enabled -}}
{{- $accounts := list
  (dict "component" "web" "clientId" "")
  (dict "component" "api" "clientId" .Values.azure.apiClientId "key" "azure.apiClientId")
-}}
{{- if .Values.analysis.enabled }}
{{- $accounts = append $accounts (dict "component" "analysis" "clientId" .Values.azure.workerClientId "key" "azure.workerClientId") -}}
{{- end }}
{{- range $accounts }}
{{- if and $wi (ne .component "web") }}
{{- $_ := include "bbm.requireInfra" (dict "root" $ "key" .key "value" .clientId) }}
{{- end }}
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "bbm.componentName" (dict "root" $ "component" .component) }}
  namespace: {{ $.Release.Namespace }}
  labels:
    {{- include "bbm.labels" (dict "root" $ "component" .component) | nindent 4 }}
  {{- $ann := deepCopy ($.Values.serviceAccounts.annotations | default dict) }}
  {{- if and $wi .clientId }}
  {{- $_ := set $ann "azure.workload.identity/client-id" .clientId }}
  {{- end }}
  {{- with $ann }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
{{- /* web never talks to Azure; others need the projected token only via WI */}}
automountServiceAccountToken: false
{{- end }}
{{- if .Values.migrations.enabled }}
{{- if $wi }}
{{- $_ := include "bbm.requireInfra" (dict "root" $ "key" "azure.migrationsClientId" "value" .Values.azure.migrationsClientId) }}
{{- end }}
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "bbm.componentName" (dict "root" $ "component" "migrations") }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "bbm.labels" (dict "root" $ "component" "migrations") | nindent 4 }}
  annotations:
    helm.sh/hook: pre-install,pre-upgrade
    helm.sh/hook-weight: "-10"
    helm.sh/hook-delete-policy: before-hook-creation,hook-succeeded
    {{- with .Values.serviceAccounts.annotations }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
    {{- if and $wi .Values.azure.migrationsClientId }}
    azure.workload.identity/client-id: {{ .Values.azure.migrationsClientId | quote }}
    {{- end }}
automountServiceAccountToken: false
{{- end }}
