{{- /* Non-secret runtime config, loaded with envFrom by every workload.
AZURE_CLIENT_ID / AZURE_TENANT_ID are NOT set here: the workload identity
webhook injects them per ServiceAccount. */ -}}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "bbm.fullname" . }}-config
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "bbm.labels" (dict "root" $) | nindent 4 }}
data:
  NODE_ENV: {{ .Values.config.nodeEnv | quote }}
  LOG_LEVEL: {{ .Values.config.logLevel | quote }}
  AZURE_STORAGE_ACCOUNT: {{ .Values.azure.storageAccountName | quote }}
  AZURE_STORAGE_BLOB_ENDPOINT: {{ .Values.azure.storageBlobEndpoint | quote }}
  AZURE_STORAGE_QUEUE: {{ .Values.azure.queueName | quote }}
  {{- range $k, $v := .Values.config.extra }}
  {{ $k }}: {{ $v | toString | quote }}
  {{- end }}
