# Local dev infrastructure. Only Postgres is enabled; the other services are
# reserved for later branches.
#
#   docker compose up -d db
#   DATABASE_URL=postgres://bbm:bbm@localhost:5432/bbm pnpm --filter @bbm/api dev
version: "3.9"

services:
  db:
    image: postgres:16-alpine
    environment:
      - POSTGRES_USER=bbm
      - POSTGRES_PASSWORD=bbm
      - POSTGRES_DB=bbm
    ports:
      - "5432:5432"
    volumes:
      - db-data:/var/lib/postgresql/data

